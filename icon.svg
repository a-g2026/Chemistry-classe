<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c4a6e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- الخلفية -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- حلقة البنزين -->
  <g transform="translate(256, 256)">
    <!-- الروابط الخارجية للحلقة (روابط مفردة) -->
    <line x1="0" y1="-120" x2="104" y2="-60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <line x1="104" y1="-60" x2="104" y2="60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <line x1="104" y1="60" x2="0" y2="120" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="120" x2="-104" y2="60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <line x1="-104" y1="60" x2="-104" y2="-60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <line x1="-104" y1="-60" x2="0" y2="-120" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    
    <!-- الرابطة المزدوجة الداخلية (جزء من الحلقة) -->
    <path d="M 0 -120 L 52 -60 M 52 -60 L 52 60 M 52 60 L 0 120 M 0 120 L -52 60 M -52 60 L -52 -60 M -52 -60 L 0 -120" 
          stroke="#06b6d4" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    
    <!-- ذرات الكربون (6 نقاط على زوايا السداسي) -->
    <!-- الأعلى -->
    <circle cx="0" cy="-120" r="14" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-112" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial">C</text>
    
    <!-- الأعلى يمين -->
    <circle cx="104" cy="-60" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <text x="104" y="-52" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial">C</text>
    
    <!-- الأسفل يمين -->
    <circle cx="104" cy="60" r="14" fill="#0369a1" stroke="#ffffff" stroke-width="2"/>
    <text x="104" y="68" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial">C</text>
    
    <!-- الأسفل -->
    <circle cx="0" cy="120" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="128" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial">C</text>
    
    <!-- الأسفل يسار -->
    <circle cx="-104" cy="60" r="14" fill="#0369a1" stroke="#ffffff" stroke-width="2"/>
    <text x="-104" y="68" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial">C</text>
    
    <!-- الأعلى يسار -->
    <circle cx="-104" cy="-60" r="14" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
    <text x="-104" y="-52" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#ffffff" font-family="Arial">C</text>
    
    <!-- هالة الوهج حول الحلقة -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  </g>
</svg>
